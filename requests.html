<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BevaBoard | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a15;
            --bg-card: #12121f;
            --bg-hover: #1a1a2e;
            --primary: #6366f1;
            --accent: #ec4899;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-diamond {
            font-size: 1.75rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rotateDiamond 3s ease-in-out infinite;
        }

        .logo-accent {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes rotateDiamond {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        .nav-item {
            padding: 0.8rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .nav-item.active, .nav-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        /* Main Content */
        .main {
            flex: 1;
            margin-left: 260px;
            padding: 2rem 3rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 16px;
        }

        .stat-label { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-value { font-size: 2rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }

        /* Filter Bar */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar input, .filter-bar select {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }

        .filter-bar input:focus, .filter-bar select:focus {
            border-color: var(--primary);
        }

        .filter-bar input {
            flex: 1;
            min-width: 200px;
        }

        .filter-bar select {
            min-width: 150px;
        }

        /* Request List */
        .request-list { display: flex; flex-direction: column; gap: 1rem; }

        .request-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .request-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .req-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .req-user { display: flex; gap: 1rem; align-items: center; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .user-info h3 { font-size: 1.1rem; }
        .user-info span { font-size: 0.9rem; color: var(--text-muted); }

        .req-meta { text-align: right; font-size: 0.85rem; color: var(--text-muted); }

        .req-body { margin-bottom: 1.5rem; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .tag { background: rgba(255,255,255,0.05); padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.8rem; border: 1px solid var(--border); }
        .message { background: var(--bg-hover); padding: 1rem; border-radius: 8px; color: #cbd5e1; line-height: 1.6; }

        .req-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-new { background: rgba(99, 102, 241, 0.15); color: var(--primary); border: 1px solid var(--primary); }
        .status-in_progress { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .status-completed { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }

        .status-select {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text);
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }

        .status-select:hover {
            border-color: var(--primary);
        }

        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .btn-reply {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-reply:hover {
            background: var(--primary);
            color: white;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }
        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        .btn-export {
            background: var(--success);
            color: white;
            padding: 0.7rem 1.5rem;
        }

        .btn-export:hover {
            background: #059669;
        }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: var(--bg-card); padding: 2.5rem; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 350px; }
        .login-box input { width: 100%; padding: 1rem; margin: 1.5rem 0; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; }
        .login-box input:focus { border-color: var(--primary); }
        .btn-primary { background: var(--primary); color: white; width: 100%; padding: 1rem; font-size: 1rem; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main {
                margin-left: 0;
                padding: 1rem;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar input, .filter-bar select {
                width: 100%;
            }
            .req-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .status-group, .action-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-overlay">
        <div class="login-box">
            <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1rem; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700;">
                <span class="logo-diamond">◆</span>
                <span class="logo-text">BEVA<span class="logo-accent">BOARD</span></span>
            </div>
            <p style="color: var(--text-muted);">Protected Area</p>
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-primary" onclick="checkLogin()">Access Dashboard</button>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            <span class="logo-diamond">◆</span>
            <span class="logo-text">BEVA<span class="logo-accent">BOARD</span></span>
        </div>
        <a href="#" class="nav-item active">📥 Inbox</a>
        <a href="#" class="nav-item">📊 Analytics</a>
        <a href="#" class="nav-item">⚙️ Settings</a>
        <div style="margin-top: auto;">
            <a href="index.html" class="nav-item">← Back to Site</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        <div class="header">
            <h1 class="page-title">Inbox</h1>
            <div class="header-actions">
                <button onclick="exportToCSV()" class="btn btn-export">📊 Export CSV</button>
                <button onclick="location.reload()" class="btn" style="background: var(--bg-card); color: var(--text); border: 1px solid var(--border);">↻ Refresh</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Requests</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">This Month</div>
                <div class="stat-value" id="stat-month">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">In Progress</div>
                <div class="stat-value" style="color: var(--warning);" id="stat-progress">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" style="color: var(--success);" id="stat-completed">0</div>
            </div>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="🔍 Search by name, email, or message...">
            <select id="status-filter">
                <option value="">All Status</option>
                <option value="new">New</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
            <select id="project-filter">
                <option value="">All Projects</option>
            </select>
            <button onclick="clearFilters()" class="btn" style="background: var(--bg-dark); color: var(--text); border: 1px solid var(--border);">Clear</button>
        </div>

        <!-- LIST -->
        <div id="requests-list" class="request-list">
            <!-- JS will fill this -->
        </div>
    </div>

    <script>
        let allRequests = [];

        // 1. LOGIN LOGIC
        function checkLogin() {
            const pass = document.getElementById('password').value;
            if (pass === 'Beva2024!') {
                document.getElementById('login-overlay').style.display = 'none';
                loadRequests();
            } else {
                alert('Access Denied');
            }
        }

        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkLogin();
        });

        // 2. LOAD DATA (FROM VERCEL API)
        async function loadRequests() {
            const container = document.getElementById('requests-list');

            try {
                const response = await fetch('/api/get-requests');
                const result = await response.json();
                allRequests = result.requests || [];

                updateStats();
                updateFilters();
                renderRequests(allRequests);

            } catch (error) {
                console.error('Error loading requests:', error);
                container.innerHTML = '<div style="text-align:center; padding: 4rem; color: var(--text-muted);">Error loading requests. Please refresh.</div>';
            }
        }

        // 3. UPDATE STATISTICS
        function updateStats() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            const thisMonthRequests = allRequests.filter(req => {
                if (!req.timestamp) return false;
                const reqDate = new Date(req.timestamp);
                return reqDate.getMonth() === currentMonth && reqDate.getFullYear() === currentYear;
            });

            const inProgressCount = allRequests.filter(req => req.status === 'in_progress').length;
            const completedCount = allRequests.filter(req => req.status === 'completed').length;

            document.getElementById('stat-total').textContent = allRequests.length;
            document.getElementById('stat-month').textContent = thisMonthRequests.length;
            document.getElementById('stat-progress').textContent = inProgressCount;
            document.getElementById('stat-completed').textContent = completedCount;
        }

        // 4. UPDATE FILTER OPTIONS
        function updateFilters() {
            const projectFilter = document.getElementById('project-filter');
            const projectTypes = new Set();

            allRequests.forEach(req => {
                if (req.project_type) {
                    req.project_type.split(',').forEach(p => projectTypes.add(p.trim()));
                }
            });

            projectFilter.innerHTML = '<option value="">All Projects</option>' +
                Array.from(projectTypes).map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
        }

        // 5. RENDER REQUESTS
        function renderRequests(requests) {
            const container = document.getElementById('requests-list');

            if (requests.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 4rem; color: var(--text-muted);">No requests found.</div>';
                return;
            }

            container.innerHTML = requests.map((req) => {
                const date = req.timestamp ? new Date(req.timestamp).toLocaleString('de-DE') : 'Unknown Date';
                const projectTypes = req.project_type ? req.project_type.split(',').map(p => p.trim()) : [];
                const status = req.status || 'new';

                const statusLabels = {
                    'new': 'Neu',
                    'in_progress': 'In Bearbeitung',
                    'completed': 'Abgeschlossen'
                };

                return `
                    <div class="request-card">
                        <div class="req-top">
                            <div class="req-user">
                                <div class="avatar">${req.name.charAt(0).toUpperCase()}</div>
                                <div class="user-info">
                                    <h3>${escapeHtml(req.name)}</h3>
                                    <span>${escapeHtml(req.email)} • ${escapeHtml(req.phone || 'No Phone')}</span>
                                </div>
                            </div>
                            <div class="req-meta">
                                <div>${date}</div>
                                <div>ID: #${req.id.toString().slice(-4)}</div>
                            </div>
                        </div>

                        <div class="req-body">
                            <div class="tags">
                                ${projectTypes.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join('')}
                                ${req.budget && req.budget !== 'N/A' ? `<span class="tag">💰 ${escapeHtml(req.budget)}</span>` : ''}
                                ${req.start_date && req.start_date !== 'N/A' ? `<span class="tag">📅 ${escapeHtml(req.start_date)}</span>` : ''}
                            </div>
                            <div class="message">${escapeHtml(req.description)}</div>
                        </div>

                        <div class="req-actions">
                            <div class="status-group">
                                <span class="status-badge status-${status}">${statusLabels[status]}</span>
                                <select class="status-select" onchange="updateStatus('${req.id}', this.value)">
                                    <option value="">Change Status...</option>
                                    <option value="new" ${status === 'new' ? 'selected' : ''}>Neu</option>
                                    <option value="in_progress" ${status === 'in_progress' ? 'selected' : ''}>In Bearbeitung</option>
                                    <option value="completed" ${status === 'completed' ? 'selected' : ''}>Abgeschlossen</option>
                                </select>
                            </div>
                            <div class="action-group">
                                <button class="btn btn-reply" onclick="replyTo('${escapeHtml(req.email)}', '${escapeHtml(req.name)}')">✉️ Reply</button>
                                <button class="btn btn-delete" onclick="deleteRequest('${req.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 6. FILTER FUNCTIONALITY
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('status-filter').addEventListener('change', applyFilters);
        document.getElementById('project-filter').addEventListener('change', applyFilters);

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const projectFilter = document.getElementById('project-filter').value;

            const filtered = allRequests.filter(req => {
                const matchesSearch = !searchTerm ||
                    req.name.toLowerCase().includes(searchTerm) ||
                    req.email.toLowerCase().includes(searchTerm) ||
                    (req.description && req.description.toLowerCase().includes(searchTerm));

                const matchesStatus = !statusFilter || req.status === statusFilter;
                const matchesProject = !projectFilter || (req.project_type && req.project_type.includes(projectFilter));

                return matchesSearch && matchesStatus && matchesProject;
            });

            renderRequests(filtered);
        }

        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('status-filter').value = '';
            document.getElementById('project-filter').value = '';
            renderRequests(allRequests);
        }

        // 7. UPDATE STATUS
        async function updateStatus(id, newStatus) {
            if (!newStatus) return;

            try {
                const response = await fetch('/api/update-request-status', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: id, status: newStatus })
                });

                const result = await response.json();

                if (result.success) {
                    // Update local data
                    const req = allRequests.find(r => r.id === id);
                    if (req) req.status = newStatus;

                    updateStats();
                    applyFilters();
                } else {
                    alert('Error updating status: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Error updating status. Please try again.');
            }
        }

        // 8. REPLY TO EMAIL
        function replyTo(email, name) {
            const subject = encodeURIComponent(`Re: Your Request - Beva Diamond`);
            const body = encodeURIComponent(`Hallo ${name},\n\nvielen Dank für Ihre Anfrage.\n\nMit freundlichen Grüßen\nBeva Diamond`);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }

        // 9. DELETE FUNCTION
        async function deleteRequest(id) {
            if(confirm('Are you sure you want to delete this request?')) {
                try {
                    const response = await fetch('/api/delete-request', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ id: id })
                    });

                    const result = await response.json();

                    if (result.success) {
                        allRequests = allRequests.filter(r => r.id !== id);
                        updateStats();
                        applyFilters();
                    } else {
                        alert('Error deleting request: ' + (result.error || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Error deleting request:', error);
                    alert('Error deleting request. Please try again.');
                }
            }
        }

        // 10. EXPORT TO CSV
        function exportToCSV() {
            if (allRequests.length === 0) {
                alert('No requests to export');
                return;
            }

            const statusLabels = {
                'new': 'Neu',
                'in_progress': 'In Bearbeitung',
                'completed': 'Abgeschlossen'
            };

            const csvContent = [
                ['ID', 'Name', 'Email', 'Phone', 'Project Type', 'Budget', 'Start Date', 'Status', 'Description', 'Timestamp'],
                ...allRequests.map(req => [
                    req.id,
                    req.name,
                    req.email,
                    req.phone || '',
                    req.project_type || '',
                    req.budget || '',
                    req.start_date || '',
                    statusLabels[req.status] || 'Neu',
                    req.description || '',
                    req.timestamp ? new Date(req.timestamp).toLocaleString('de-DE') : ''
                ])
            ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `beva-requests-${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
